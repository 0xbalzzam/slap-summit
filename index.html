<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Slap Summit | Online Slap Game with Satirical Parody Leaders</title>
<meta name="description" content="Absurd mobile-friendly browser game: slap 15 fictional parody dignitaries with a wet fish, baguette, slipper and more. Pure satire, zero dependencies.">
<meta name="theme-color" content="#FFD23F">

<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://slap-summit.onrender.com/">
<meta property="og:title" content="Slap Summit">
<meta property="og:description" content="Slap 15 fictional parody dignitaries with a wet fish. Mobile-friendly, single-file browser game.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Slap Summit">
<meta name="twitter:description" content="Slap 15 fictional parody dignitaries with a wet fish. Mobile-friendly browser game.">

<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFD23F; --ink:#1B1A33; --card:#FFF6D6; --pop:#E8294C; --ok:#12A594; --warn:#F59E0B; --lock:#B9B39A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#2A2150; --ink:#FFF1C9; --card:#3A2F6B; --pop:#FF4D6D; --ok:#2DD4BF; --warn:#FBBF24; --lock:#6B5FA3; }
}
:root[data-theme="dark"]{ --bg:#2A2150; --ink:#FFF1C9; --card:#3A2F6B; --pop:#FF4D6D; --ok:#2DD4BF; --warn:#FBBF24; --lock:#6B5FA3; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
html,body{ margin:0; background:var(--bg); color:var(--ink); }
body{ height:100%; font-family:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; overflow-x:hidden; }
[hidden]{ display:none!important; }
button,a.btn{ font:inherit; color:inherit; cursor:pointer; text-decoration:none; }
button:focus-visible,a:focus-visible,input:focus-visible{ outline:3px solid var(--pop); outline-offset:2px; }
.disp{ font-family:"Bangers","Impact","Arial Black",sans-serif; font-weight:400; letter-spacing:1.5px; }

/* ---------- shared ---------- */
.btn{ display:inline-block; border:3px solid var(--ink); background:var(--card); border-radius:12px; padding:7px 14px; font-weight:800; box-shadow:3px 3px 0 var(--ink); }
.btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
.btn.hot{ background:var(--pop); color:#fff; }
.chip{ border:3px solid var(--ink); border-radius:999px; padding:5px 14px; background:var(--card); font-weight:800; font-size:14px; }
button.chip{ box-shadow:3px 3px 0 var(--ink); }
button.chip:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }

/* ---------- select screen ---------- */
#select{ max-width:760px; margin:0 auto; padding:18px 16px 28px; }
.hero{ text-align:center; padding:8px 0 4px; }
.logo{ font-family:"Bangers","Impact","Arial Black",sans-serif; font-weight:400; font-size:clamp(54px,17vw,92px); line-height:.9; letter-spacing:2px; margin:6px 0 0; transform:rotate(-3deg); text-shadow:4px 4px 0 var(--pop); }
.sub{ font-weight:600; margin:14px auto 0; max-width:32ch; font-size:16px; }
.row{ display:flex; gap:10px; justify-content:center; margin:12px 0; flex-wrap:wrap; align-items:center; }
.modes{ display:flex; justify-content:center; margin:14px 0 4px; }
.modes button{ border:3px solid var(--ink); background:var(--card); padding:9px 14px; font-weight:800; font-size:16px; }
.modes button+button{ border-left:0; }
.modes button:first-child{ border-radius:14px 0 0 14px; }
.modes button:last-child{ border-radius:0 14px 14px 0; }
.modes button[aria-pressed="true"]{ background:var(--pop); color:#fff; }
.modehelp{ text-align:center; font-size:14px; font-weight:600; margin:6px auto 12px; max-width:36ch; min-height:2.4em; }
.wlabel{ text-align:center; font-weight:800; font-size:13px; margin:8px 0 2px; }
.wrow{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.wbtn{ position:relative; width:52px; height:52px; border:3px solid var(--ink); border-radius:14px; background:var(--card); font-size:28px; line-height:1; padding:0; box-shadow:3px 3px 0 var(--ink); }
.wbtn[aria-pressed="true"]{ background:var(--warn); transform:translate(1px,1px); box-shadow:2px 2px 0 var(--ink); }
.wbtn.locked{ background:var(--lock); filter:grayscale(.8); font-size:20px; }
.wbtn.locked small{ position:absolute; bottom:-1px; left:0; right:0; font-size:10px; font-weight:800; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:14px; margin-top:16px; }
.card{ position:relative; text-align:left; padding:0 0 10px; background:var(--card); border:3px solid var(--ink); border-radius:18px 18px 22px 12px; box-shadow:5px 5px 0 var(--ink); overflow:hidden; transition:transform .12s, box-shadow .12s; }
.card:nth-child(even){ border-radius:12px 22px 18px 18px; }
.card:active{ transform:translate(4px,4px); box-shadow:1px 1px 0 var(--ink); }
.thumb{ aspect-ratio:1/1; border-bottom:3px solid var(--ink); overflow:hidden; }
.thumb svg{ width:100%; height:100%; display:block; }
.nm{ font-weight:800; font-size:15px; padding:8px 10px 0; line-height:1.15; }
.tt{ font-size:12px; padding:2px 10px 0; opacity:.8; line-height:1.25; }
.badge{ position:absolute; top:8px; right:8px; background:var(--pop); color:#fff; font-family:"Bangers","Impact",sans-serif; letter-spacing:1px; font-size:16px; padding:2px 10px; border:3px solid var(--ink); border-radius:8px; transform:rotate(8deg); }
.badge.daily{ left:8px; right:auto; background:var(--warn); color:#1B1A33; transform:rotate(-7deg); }
.fine{ text-align:center; font-size:12px; opacity:.75; margin:22px auto 0; max-width:42ch; }

/* ---------- play screen ---------- */
#play{ height:100%; max-width:640px; margin:0 auto; display:flex; flex-direction:column; }
.bar{ display:flex; align-items:center; gap:10px; padding:10px 14px 4px; }
.who{ flex:1; min-width:0; line-height:1.15; text-align:center; }
.who b{ display:block; font-family:"Bangers","Impact",sans-serif; font-size:24px; letter-spacing:1px; font-weight:400; }
.who span{ display:block; font-size:12px; opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.meter{ display:flex; align-items:center; gap:10px; padding:6px 16px 0; font-weight:800; font-size:13px; }
.track{ flex:1; height:20px; border:3px solid var(--ink); border-radius:999px; background:var(--card); overflow:hidden; }
#fill{ display:block; height:100%; width:100%; background:var(--ok); transition:width .15s, background .2s; }
#timer{ font-family:"Bangers","Impact",sans-serif; font-size:26px; letter-spacing:1px; min-width:64px; text-align:right; }
#timer.low{ color:var(--pop); }
#stage{ position:relative; flex:1; min-height:0; overflow:hidden; touch-action:none; display:flex; align-items:flex-end; justify-content:center; cursor:crosshair; }
#stage.shake{ animation:shake .28s; }
@keyframes shake{ 0%,100%{transform:none} 20%{transform:translate(-7px,4px)} 40%{transform:translate(6px,-5px)} 60%{transform:translate(-5px,-3px)} 80%{transform:translate(4px,3px)} }
.facebox{ width:min(84vw,46vh,360px); margin-bottom:2vh; transform-origin:50% 90%; }
.facebox svg{ width:100%; height:auto; display:block; overflow:visible; }
.facebox.hl{ animation:flingR .34s ease-out; }
.facebox.hr{ animation:flingL .34s ease-out; }
.facebox.ko1{ animation:ko1 1s ease-in forwards; }
.facebox.ko2{ animation:ko2 .95s ease-in forwards; }
.facebox.ko3{ animation:ko3 .9s ease-in forwards; }
.facebox.ko4{ animation:ko4 .95s ease-in forwards; }
@keyframes flingR{ 0%{transform:none} 30%{transform:translateX(38px) rotate(13deg) scale(.96,1.04)} 65%{transform:translateX(-8px) rotate(-4deg)} 100%{transform:none} }
@keyframes flingL{ 0%{transform:none} 30%{transform:translateX(-38px) rotate(-13deg) scale(.96,1.04)} 65%{transform:translateX(8px) rotate(4deg)} 100%{transform:none} }
@keyframes ko1{ 0%{transform:none} 35%{transform:rotate(-14deg) translateY(-18px)} 100%{transform:rotate(70deg) translate(30px,120vh)} }
@keyframes ko2{ 0%{transform:none} 18%{transform:scale(1.12,.86)} 100%{transform:translate(110vw,-90vh) rotate(1440deg) scale(.1)} }
@keyframes ko3{ 0%{transform:none} 35%{transform:scale(1.35,.14)} 70%{transform:scale(1.35,.14)} 100%{transform:scale(1.8,0);opacity:0} }
@keyframes ko4{ 0%{transform:none} 100%{transform:rotate(1080deg) scale(0)} }
.face .e-h,.face .m-h{ display:none; }
.face.hit .e-h,.face.hit .m-h{ display:inline; }
.face.hit .e-n,.face.hit .m-n{ display:none; }
.hand{ position:absolute; font-size:104px; line-height:1; pointer-events:none; opacity:0; z-index:5; }
.hand.l{ animation:handL .26s ease-out; }
.hand.r{ animation:handR .26s ease-out; }
@keyframes handL{ 0%{opacity:0;transform:translate(-210px,-50px) rotate(-75deg)} 25%{opacity:1} 45%{opacity:1;transform:translate(0,0) rotate(8deg) scale(1.2)} 100%{opacity:0;transform:translate(16px,2px) rotate(14deg) scale(1)} }
@keyframes handR{ 0%{opacity:0;transform:translate(210px,-50px) rotate(75deg) scaleX(-1)} 25%{opacity:1} 45%{opacity:1;transform:translate(0,0) rotate(-8deg) scale(1.2) scaleX(-1)} 100%{opacity:0;transform:translate(-16px,2px) rotate(-14deg) scale(1) scaleX(-1)} }
.pop{ position:absolute; z-index:6; pointer-events:none; font-family:"Bangers","Impact",sans-serif; font-size:42px; letter-spacing:2px; color:var(--c,#fff); -webkit-text-stroke:2px #1B1A33; text-shadow:3px 3px 0 #1B1A33; animation:rise .7s ease-out forwards; white-space:nowrap; }
.pop.crit{ font-size:58px; --c:#FFD23F; }
@keyframes rise{ 0%{opacity:0;transform:translate(-50%,0) rotate(var(--r)) scale(.5)} 20%{opacity:1;transform:translate(-50%,-14px) rotate(var(--r)) scale(1.2)} 100%{opacity:0;transform:translate(-50%,-80px) rotate(var(--r)) scale(1)} }
.conf{ position:absolute; z-index:7; pointer-events:none; left:50%; top:60%; font-size:30px; animation:conf 1s ease-out forwards; }
@keyframes conf{ 0%{opacity:1;transform:translate(-50%,-50%) scale(.4)} 100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1.2)} }
.stamp{ position:absolute; z-index:9; left:50%; top:46%; pointer-events:none; font-family:"Bangers","Impact",sans-serif; font-size:clamp(40px,13vw,72px); letter-spacing:2px; color:#fff; background:var(--pop); border:5px solid #1B1A33; border-radius:14px; padding:2px 18px; box-shadow:6px 6px 0 #1B1A33; white-space:nowrap; animation:stamp 1.7s ease-out forwards; }
.lock{ position:absolute; z-index:9; left:50%; top:40%; transform:translate(-50%,-50%) rotate(-4deg); text-align:center; pointer-events:none; font-family:"Bangers","Impact",sans-serif; font-size:clamp(34px,10vw,56px); letter-spacing:2px; line-height:1.05; color:#fff; background:var(--pop); border:5px solid #1B1A33; border-radius:14px; padding:6px 20px; box-shadow:6px 6px 0 #1B1A33; white-space:nowrap; }
.lock small{ display:block; font-size:.62em; color:#FFD23F; }
@keyframes stamp{ 0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(3)} 14%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)} 80%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)} 100%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(.9)} }
#bubble{ position:absolute; top:10px; left:50%; transform:translateX(-50%); width:min(88%,420px); box-sizing:border-box; text-align:center; font-weight:800; font-size:17px; line-height:1.25; padding:12px 16px; background:var(--card); border:3px solid var(--ink); border-radius:20px; box-shadow:4px 4px 0 var(--ink); z-index:4; pointer-events:none; }
#bubble::after{ content:""; position:absolute; left:50%; bottom:-14px; width:20px; height:20px; background:var(--card); border:3px solid var(--ink); border-top:0; border-left:0; transform:translateX(-50%) rotate(45deg); }
#bubble.say{ animation:bub .22s ease-out; }
@keyframes bub{ 0%{transform:translateX(-50%) scale(.85)} 100%{transform:translateX(-50%) scale(1)} }
.wrow.play{ padding:8px 10px 8px; gap:6px; flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; scrollbar-width:none; }
.wrow.play::-webkit-scrollbar{ display:none; }
.wbtn{ flex-shrink:0; }
.wrow.play .wbtn{ width:46px; height:46px; font-size:24px; border-radius:12px; }
.hud{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 16px 14px; font-weight:600; font-size:14px; }
.hud b{ font-family:"Bangers","Impact",sans-serif; font-weight:400; font-size:26px; letter-spacing:1px; margin-left:4px; }
#combo{ font-family:"Bangers","Impact",sans-serif; font-size:30px; letter-spacing:1px; color:var(--pop); min-width:90px; text-align:center; }
.kocard{ position:absolute; z-index:10; left:50%; top:50%; transform:translate(-50%,-50%); width:min(88%,380px); box-sizing:border-box; background:var(--card); border:4px solid var(--ink); border-radius:22px; box-shadow:7px 7px 0 var(--ink); padding:18px 18px 16px; text-align:center; cursor:default; animation:bub2 .3s ease-out; }
@keyframes bub2{ 0%{transform:translate(-50%,-50%) scale(.7);opacity:0} 100%{transform:translate(-50%,-50%) scale(1);opacity:1} }
.kocard h2{ font-family:"Bangers","Impact",sans-serif; font-weight:400; font-size:60px; line-height:1; margin:0; letter-spacing:3px; color:var(--pop); text-shadow:3px 3px 0 var(--ink); }
.kocard p{ margin:8px 0 14px; font-weight:600; }
.kocard .stats{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 0 12px; }
.kocard .row{ margin:6px 0 0; }

/* ---------- sheets, modal, toast ---------- */
.overlay{ position:fixed; inset:0; z-index:50; background:rgba(10,8,30,.62); display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
.sheet{ width:min(100%,460px); max-height:86vh; overflow:auto; background:var(--card); border:4px solid var(--ink); border-radius:22px; box-shadow:7px 7px 0 var(--ink); padding:18px; box-sizing:border-box; }
.sheet h2{ font-family:"Bangers","Impact",sans-serif; font-weight:400; font-size:40px; letter-spacing:2px; margin:0 0 8px; }
.sheet p{ margin:6px 0 12px; font-weight:600; font-size:14px; }
.tabs{ display:flex; gap:8px; margin-bottom:10px; }
.tabs button{ flex:1; border:3px solid var(--ink); background:var(--card); border-radius:10px; padding:6px; font-weight:800; }
.tabs button[aria-pressed="true"]{ background:var(--pop); color:#fff; }
.lb{ list-style:none; margin:0 0 12px; padding:0; }
.lb li{ display:flex; gap:10px; align-items:center; padding:7px 10px; border:3px solid var(--ink); border-radius:12px; margin-bottom:6px; background:var(--bg); font-weight:800; }
.lb li.me{ background:var(--warn); color:#1B1A33; }
.lb .rk{ font-family:"Bangers","Impact",sans-serif; font-size:24px; min-width:34px; }
.lb .nk{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lb .sc{ font-family:"Bangers","Impact",sans-serif; font-size:24px; }
.lb .ex{ font-size:11px; opacity:.75; display:block; font-weight:600; }
.empty{ text-align:center; opacity:.8; padding:14px 0; font-weight:600; }
.tro{ list-style:none; margin:0 0 12px; padding:0; }
.tro li{ display:flex; gap:10px; align-items:center; padding:8px 10px; border:3px solid var(--ink); border-radius:12px; margin-bottom:6px; font-weight:600; font-size:14px; }
.tro li.got{ background:var(--warn); color:#1B1A33; }
.tro li.no{ opacity:.65; }
.tro .ic{ font-size:26px; }
.tro b{ display:block; font-weight:800; }
.nickin{ width:100%; box-sizing:border-box; font:inherit; font-weight:800; font-size:20px; padding:10px 14px; border:3px solid var(--ink); border-radius:12px; background:#fff; color:#1B1A33; margin:6px 0 12px; text-align:center; user-select:text; -webkit-user-select:text; }
#toast{ position:fixed; z-index:80; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); max-width:90vw; background:var(--ink); color:var(--bg); border-radius:14px; padding:10px 18px; font-weight:800; text-align:center; animation:toast 2.6s ease-out forwards; }
@keyframes toast{ 0%{opacity:0;transform:translate(-50%,20px)} 10%{opacity:1;transform:translate(-50%,0)} 88%{opacity:1} 100%{opacity:0} }
@media (prefers-reduced-motion:reduce){
  .facebox,.hand,.pop,.conf,.stamp,#bubble.say,.kocard,#stage.shake,#toast{ animation-duration:.01ms!important; }
}
</style>
</head>
<body>

<main id="select">
  <div class="hero">
    <h1 class="logo">SLAP SUMMIT</h1>
    <p class="sub">Fifteen totally fictional dignitaries. Zero dignity remaining.</p>
  </div>
  <div class="row">
    <button class="chip" id="nickChip" aria-label="Change nickname"></button>
    <span class="chip">Slaps: <span id="sTot">0</span></span>
    <span class="chip">Humbled: <span id="sKo">0</span>/15</span>
  </div>
  <div class="row">
    <button class="btn" id="openBoard">Leaderboard</button>
    <button class="btn" id="openTro">Trophies <span id="troCount"></span></button>
  </div>
  <div class="modes" role="group" aria-label="Game mode">
    <button id="mClassic" aria-pressed="true">Classic</button>
    <button id="mRush" aria-pressed="false">Rush 45s</button>
    <button id="mEndless" aria-pressed="false">Endless</button>
  </div>
  <p class="modehelp" id="modeHelp"></p>
  <div class="wlabel">Pick your weapon</div>
  <div class="wrow" id="wSelect"></div>
  <div class="grid" id="grid"></div>
  <p class="fine">Pure parody. Every character is an invented cartoon and any resemblance is a coincidence we are very proud of. No actual people were slapped.</p>
</main>

<section id="play" hidden>
  <header class="bar">
    <button class="btn" id="back" aria-label="Back to character select">Back</button>
    <div class="who"><b id="pname"></b><span id="ptitle"></span></div>
    <button class="btn" id="finish" hidden>Finish</button>
    <button class="btn" id="mute" aria-label="Toggle sound">🔊</button>
  </header>
  <div class="meter"><span>Dignity</span><div class="track"><i id="fill"></i></div><span id="timer" hidden>45.0</span></div>
  <div id="stage">
    <div id="bubble"></div>
    <div id="fb" class="facebox"></div>
    <div id="hand" class="hand">✋</div>
    <div id="card" class="kocard" hidden></div>
  </div>
  <div class="wrow play" id="wPlay"></div>
  <footer class="hud">
    <div>Score<b id="sc">0</b></div>
    <div id="combo"></div>
    <div>Total<b id="tot">0</b></div>
  </footer>
</section>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
/* ---------- characters (all fictional parodies) ---------- */
const C=[
 {id:'husk',name:"Elan Husk",title:"Rocket Tycoon",bg:"#8ECAE6",skin:"#F1C6A4",hair:"short",hairCol:"#3B2A20",suit:"#23232B",tie:"#D62839",

 {id:'kimchi',name:"Supreme Leader Kimchi",title:"Haircut Of The Nation",bg:"#FFC8DD",skin:"#F1D3B3",hair:"bowl",hairCol:"#16161A",suit:"#3A4A3A",tie:null,glasses:"round",
  items:[["🍜",178,268,36,0],["✂️",36,66,30,-20]],

 {id:'zuck',name:"Mark Zuckerbot",title:"Definitely A Human Man",bg:"#CAF0F8",skin:"#B7C7D1",hair:"short",hairCol:"#5A4630",suit:"#7C8794",tie:null,pupil:"#FF2D2D",

/* ---------- face builder ---------- */
function darker(h){const n=parseInt(h.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;return `rgb(${Math.round(r*.78)},${Math.round(g*.78)},${Math.round(b*.78)})`;}
function hairShape(st,col){
  switch(st){
    case 'swoop': return `<path d="M52 110 Q36 36 118 40 Q202 38 190 112 Q176 76 128 80 Q92 66 62 104Z" fill="${col}"/><path d="M56 96 Q92 36 196 80 Q150 54 100 68Z" fill="${col}"/>`;
    case 'short': return `<path d="M54 112 Q46 42 120 44 Q194 42 186 112 Q172 78 120 80 Q68 78 54 112Z" fill="${col}"/>`;
    case 'side': return `<path d="M54 112 Q46 42 120 44 Q194 42 186 112 Q170 86 130 78 Q90 74 54 112Z" fill="${col}"/><path d="M118 46 Q112 66 90 76" stroke="${darker(col)}" stroke-width="3" fill="none"/>`;
    case 'mop': return `<path d="M48 120 Q30 60 70 46 Q80 22 110 40 Q130 14 156 40 Q196 36 192 80 Q202 100 188 122 Q176 84 150 80 Q120 94 90 80 Q64 84 48 120Z" fill="${col}"/>`;
    case 'bowl': return `<path d="M48 128 Q36 44 120 40 Q204 44 192 128 L184 96 L56 96Z" fill="${col}"/>`;
    case 'wild': return `<g fill="${col}"><circle cx="62" cy="88" r="18"/><circle cx="78" cy="62" r="22"/><circle cx="104" cy="50" r="22"/><circle cx="136" cy="50" r="22"/><circle cx="162" cy="62" r="22"/><circle cx="178" cy="88" r="18"/></g>`;
    case 'bald': return `<ellipse cx="96" cy="68" rx="18" ry="8" fill="#fff" opacity=".45" transform="rotate(-20 96 68)"/>`;
  }
  return '';
}
function face(c,thumb){
  const sk=c.skin, sh=darker(sk), hc=c.hairCol||'#333', ink='#1B1A33';
  let s=`<svg class="face" viewBox="${thumb?'26 22 188 198':'0 0 240 300'}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${c.name}">`;
  if(c.ears==='bear'){
    s+=`<circle cx="66" cy="64" r="24" fill="#7A4B2A"/><circle cx="66" cy="64" r="12" fill="#E0A77A"/><circle cx="174" cy="64" r="24" fill="#7A4B2A"/><circle cx="174" cy="64" r="12" fill="#E0A77A"/>`;
  }
  s+=`<path d="M10 300 Q20 232 120 226 Q220 232 230 300Z" fill="${c.suit||sk}"/>`;
  if(c.belt) s+=`<rect x="10" y="286" width="220" height="14" fill="#16161A"/>`;
  s+=`<rect x="100" y="186" width="40" height="54" rx="10" fill="${sh}"/>`;
  if(c.suit){
    if(c.tie){
      const tl=c.longTie?310:298;
      s+=`<path d="M92 230 L120 272 L148 230Z" fill="#fff"/><path d="M114 246 L126 246 L132 ${tl-8} L120 ${tl} L108 ${tl-8}Z" fill="${c.tie}"/>`;
    } else {
      s+=`<path d="M96 228 Q120 258 144 228Z" fill="${sh}"/>`;
    }
  }
  s+=`<ellipse cx="52" cy="136" rx="11" ry="19" fill="${sk}"/><ellipse cx="188" cy="136" rx="11" ry="19" fill="${sk}"/>`;
  s+=`<ellipse cx="120" cy="130" rx="68" ry="78" fill="${sk}"/>`;
  s+=`<circle cx="72" cy="158" r="13" fill="#FF6B81" opacity=".28"/><circle cx="168" cy="158" r="13" fill="#FF6B81" opacity=".28"/>`;
  s+=hairShape(c.hair,hc);
  if(c.burns) s+=`<path d="M54 110 L60 164 L74 150 L70 108Z" fill="${hc}"/><path d="M186 110 L180 164 L166 150 L170 108Z" fill="${hc}"/>`;
  if(c.hat==='beret') s+=`<ellipse cx="128" cy="54" rx="66" ry="21" fill="#1D3557" transform="rotate(-8 128 54)"/><rect x="120" y="26" width="9" height="14" rx="3" fill="#1D3557"/>`;
  if(c.hat==='cap') s+=`<path d="M50 102 Q56 42 120 42 Q184 42 190 102Z" fill="${c.hatCol}"/><path d="M44 104 Q120 88 196 104 L200 112 Q120 98 40 112Z" fill="${darker(c.hatCol)}"/>`;
  /* eyes */
  const brow=c.hair==='bald'||c.hair==='wild'||c.hair==='bowl'?'#3a2e2a':hc;
  s+=`<g class="e-n"><ellipse cx="92" cy="122" rx="14" ry="15" fill="#fff"/><ellipse cx="148" cy="122" rx="14" ry="15" fill="#fff"/><circle cx="94" cy="124" r="7" fill="${c.pupil||ink}"/><circle cx="146" cy="124" r="7" fill="${c.pupil||ink}"/><circle cx="96" cy="121" r="2.4" fill="#fff"/><circle cx="148" cy="121" r="2.4" fill="#fff"/>`;
  if(c.sleepy) s+=`<rect x="76" y="106" width="32" height="15" fill="${sk}"/><rect x="132" y="106" width="32" height="15" fill="${sk}"/><path d="M78 120 H106 M134 120 H162" stroke="${ink}" stroke-width="3"/>`;
  s+=`</g><g class="e-h" fill="none" stroke="${ink}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M78 110 L104 124 L78 138"/><path d="M162 110 L136 124 L162 138"/></g>`;
  s+=`<path d="M76 102 Q92 92 108 100 M132 100 Q148 92 164 102" stroke="${brow}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  s+=`<path d="M121 128 Q108 152 121 157" stroke="${sh}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
  /* glasses */
  if(c.glasses==='round') s+=`<g fill="none" stroke="#111" stroke-width="4.5"><circle cx="92" cy="122" r="20"/><circle cx="148" cy="122" r="20"/><path d="M112 122 H128"/></g>`;
  if(c.glasses==='square') s+=`<g fill="none" stroke="#111" stroke-width="4.5"><rect x="71" y="106" width="42" height="32" rx="7"/><rect x="127" y="106" width="42" height="32" rx="7"/><path d="M113 120 H127"/></g>`;
  if(c.glasses==='aviator') s+=`<path d="M70 106 H114 Q114 142 92 144 Q70 142 70 106Z M126 106 H170 Q170 142 148 144 Q126 142 126 106Z" fill="#111" opacity=".88"/><path d="M114 112 H126" stroke="#111" stroke-width="4"/>`;
  /* mouth */
  s+=`<path class="m-n" d="M94 172 Q120 192 146 172" fill="none" stroke="#7A2E2E" stroke-width="5.5" stroke-linecap="round"/>`;
  s+=`<g class="m-h"><ellipse cx="120" cy="180" rx="16" ry="14" fill="#6B1D2A"/><ellipse cx="120" cy="187" rx="9" ry="6" fill="#E5707E"/></g>`;
  if(c.stache) s+=`<path d="M120 164 Q96 148 74 170 Q96 178 120 169 Q144 178 166 170 Q144 148 120 164Z" fill="${c.stache}"/>`;
  /* items */
  (c.items||[]).forEach(it=>{
    if(thumb && it[2]>200) return;
    s+=`<text x="${it[1]}" y="${it[2]}" font-size="${it[3]}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${it[4]} ${it[1]} ${it[2]})">${it[0]}</text>`;
  });
  if(!thumb) s+=`<g class="marks"></g>`;
  return s+`</svg>`;
}

    save.cid=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('c'+Date.now().toString(36)+Math.random().toString(36).slice(2,12));
    persist();
  }
  return save.cid;
}
function sbHeaders(json){const h={apikey:SUPABASE_KEY};if(SUPABASE_KEY.indexOf('eyJ')===0)h.Authorization='Bearer '+SUPABASE_KEY;if(json)h['Content-Type']='application/json';return h;}
async function sbFetchBoard(){
  if(boardBusy)return;boardBusy=true;
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/scores?select=client_id,nick,best,kos,left_s&order=best.desc&limit=20',{headers:sbHeaders(false)});
    if(!r.ok)throw new Error('http '+r.status);
    const rows=await r.json();
    board=rows.map(x=>({id:x.client_id,nick:x.nick,best:x.best,kos:x.kos,left:x.left_s}));
    boardState='live';
  }catch(e){if(boardState!=='live')boardState='error';}
  boardBusy=false;
  if(sheetKind==='board')renderSheet();
}
async function sbSubmit(score,kos,left){
  const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/submit_score',{
    method:'POST',headers:sbHeaders(true),
    body:JSON.stringify({p_client:cid(),p_nick:save.nick,p_best:Math.min(score,100000),p_kos:Math.min(kos,15),p_left:Math.min(Math.max(left,0),600),p_weapon:weaponId})
  });
  if(!r.ok)throw new Error('http '+r.status);
}
async function initCloud(){
  if(SB){sbFetchBoard();setInterval(()=>{if(sheetKind==='board')sbFetchBoard();},20000);return;}
  /* fallback: shared database inside Claude artifacts */
  try{
    if(!window.claude||!claude.use){boardState='off';return;}
    const [u,d]=await Promise.all([claude.use('user'),claude.use('db')]);
    if(!u||!d){boardState='off';return;}
    UID=await u.id();
    if(!UID){boardState='off';return;}
    DB=d;boardState='live';
    d.collection('scores').orderBy('best','desc').limit(20).onSnapshot(
      s=>{board=s.docs.map(x=>Object.assign({id:x.id},x.data()));if(sheetKind==='board')renderSheet();},
      ()=>{boardState='off';}
    );
  }catch(e){boardState='off';}
}
async function submitScore(score,kos,cleared,left){
  const run={nick:save.nick,score,kos,cleared:!!cleared,ts:Date.now()};
  save.runs.push(run);save.runs.sort((a,b)=>b.score-a.score);save.runs=save.runs.slice(0,10);
  if(score>save.rushBest)save.rushBest=score;
  persist();
  if(!cleared)return;
  if(SB){
    try{await sbSubmit(score,kos,left);await sbFetchBoard();}
    catch(e){toast("Could not reach the leaderboard. Score kept on this device.");}
    return;
  }
  if(!DB||!UID)return;
  try{
    const ref=DB.doc('scores/'+UID),snap=await ref.get(),old=snap.exists?snap.data():null;
    if(!old||score>(old.best||0)){
      await ref.set({nick:save.nick,best:score,kos:kos,left:left,weapon:weaponId,ts:Date.now()});
    }else if(old.nick!==save.nick){
      await ref.update({nick:save.nick});
    }
  }catch(e){toast("Shared board is read-only for you. Score kept on this device.");}
}

/* ---------- game ---------- */
const CAPS=["SKILL ISSUE","RATIO + L","TOUCH GRASS","NOT STONKS","GG EZ","BONK!","L + RATIO","DEPLOYED TO MARS","NO DIGNITY LEFT","CANCELLED (BY HAND)","DELETED","PEAK DIPLOMACY"];
const CONF=["💥","⭐","💫","✨"];
function say(t){bubble.textContent=t;bubble.classList.remove('say');void bubble.offsetWidth;bubble.classList.add('say');}
function setMeter(){fill.style.width=dig+'%';fill.style.background=dig>50?'var(--ok)':dig>25?'var(--warn)':'var(--pop)';}
function setTimerUI(){
  if(rush){timerEl.hidden=false;timerEl.textContent=Math.max(0,rush.time).toFixed(1);timerEl.classList.toggle('low',rush.time<=8);}
  else if(endless){timerEl.hidden=false;timerEl.textContent=endless.slaps+' slaps';timerEl.classList.remove('low');}
  else timerEl.hidden=true;
}
function loadChar(i){
  cur=i;const c=C[i];dig=100;ko=false;combo=0;
  $('pname').textContent=c.name;$('ptitle').textContent=rush?`Victim ${rush.kos+1} of ${C.length}. ${c.intro}`:c.intro;
  fb.className='facebox';fb.innerHTML=face(c,false);
  svg=fb.querySelector('svg');marksG=svg.querySelector('.marks');
  stage.style.background=c.bg;cardEl.hidden=true;comboEl.textContent='';
  hand.textContent=WBY[weaponId].emoji;setMeter();setTimerUI();
}
function startGame(i){
  stopRush();
  score=0;maxCombo=0;rush=null;endless=null;
  if(mode==='rush'){
    const rest=C.map((_,k)=>k).filter(k=>k!==i);
    for(let k=rest.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[rest[k],rest[j]]=[rest[j],rest[k]];}
    rush={time:45,kos:0,started:false,done:false,queue:[i].concat(rest)};
  }else if(mode==='endless'){
    endless={slaps:0,kos:0,done:false};
  }
  loadChar(i);
  scEl.textContent='0';totEl.textContent=save.slaps.toLocaleString('en-US');
  renderWeapons($('wPlay'));
  say(rush?"Rush! Humble all 15 to clear the summit. The clock starts on your first slap.":endless?"Endless mode. 100 slaps and I go down. Then you get 5 seconds off. Hit Finish when your arm gives up.":"Go on. Slap me. Tap or swipe!");
  $('finish').hidden=!endless;
  selEl.hidden=true;plEl.hidden=false;
  if(i===DAILY)toast("Today's victim: double points!");
}
function stopRush(){clearInterval(rushTimer);rushTimer=null;}
function leave(){
  stopRush();clearLock();
  if(endless&&!endless.done&&endless.slaps>save.endlessBest){save.endlessBest=endless.slaps;persist();}
  rush=null;endless=null;$('finish').hidden=true;
  plEl.hidden=true;selEl.hidden=false;renderSelect();
}
function startRushClock(){
  rush.started=true;
  rushTimer=setInterval(()=>{
    if(!rush||rush.done)return;
    if(!ko)rush.time-=.1;
    setTimerUI();
    if(rush.time<=0)endRush();
  },100);
}

function doSlap(cx,cy){
  const fr=svg.getBoundingClientRect(),sr=stage.getBoundingClientRect();
  const side=cx<fr.left+fr.width/2?-1:1;
  lastSwipe=performance.now();
  hand.style.left=(cx-sr.left-52)+'px';hand.style.top=(cy-sr.top-52)+'px';
  hand.className='hand';void hand.offsetWidth;hand.className='hand '+(side<0?'l':'r');
  ctx();
  setTimeout(()=>impact(cx,cy,side),120);
}
function impact(cx,cy,side){
  if(ko)return;
  if(rush){if(rush.done)return;if(!rush.started)startRushClock();}
  const c=C[cur],w=WBY[weaponId],fr=svg.getBoundingClientRect(),sr=stage.getBoundingClientRect(),now=performance.now();
  combo=(now-lastHit<1100)?combo+1:1;lastHit=now;if(combo>maxCombo)maxCombo=combo;
  const mult=1+Math.floor(combo/6),crit=Math.random()<.1,daily=cur===DAILY;
  dig=Math.max(0,dig-(4+Math.random()*3.5)*w.dmg*(crit?2.5:1));
  score+=Math.round(10*mult*w.pts*(crit?3:1)*(daily?2:1));
  save.slaps++;save.wc[weaponId]=(save.wc[weaponId]||0)+1;
  if(endless){endless.slaps++;dig=endless.slaps%100===0?0:100-(endless.slaps%100);setTimerUI();}
  const nw=W.find(x=>x.at===save.slaps);
  if(nw&&nw.at>0){toast(`New weapon unlocked: ${nw.name} ${nw.emoji}`);renderWeapons($('wPlay'));}
  scEl.textContent=score;totEl.textContent=save.slaps.toLocaleString('en-US');
  comboEl.textContent=combo>=3?`x${combo} COMBO`:'';
  clearTimeout(comboT);comboT=setTimeout(()=>{comboEl.textContent='';},1300);
  setMeter();
  if(crit){sfxCrit();buzz([40,30,60]);stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');save.crits++;if(save.crits>=10)unlockTro('crit');}
  else{sfx(weaponId);buzz(22);}
  /* trophies */
  if(save.slaps===1)unlockTro('first');
  if(save.slaps>=100)unlockTro('century');
  if(combo>=15)unlockTro('combo15');
  if((save.wc.fish||0)>=40)unlockTro('fishy');
  if(save.slaps>=3000)unlockTro('pizza');
  /* handprint */
  const ex=Math.min(190,Math.max(50,(cx-fr.left)/fr.width*240)),ey=Math.min(200,Math.max(84,(cy-fr.top)/fr.height*300));
  const m=document.createElementNS('http://www.w3.org/2000/svg','g');
  m.setAttribute('transform',`translate(${ex.toFixed(1)} ${ey.toFixed(1)}) rotate(${side*(-14+Math.random()*10)})`);
  m.innerHTML=`<ellipse rx="17" ry="22" fill="#E11D48" opacity=".5"/><path d="M-12 -18 l-3 -16 M-4 -22 l-1 -18 M5 -22 l1 -18 M13 -18 l4 -15" stroke="#E11D48" stroke-width="5" stroke-linecap="round" opacity=".5"/>`;
  m.style.transition='opacity 1.2s';marksG.appendChild(m);
  setTimeout(()=>{m.style.opacity='0';},2200);setTimeout(()=>m.remove(),3600);
  /* face reaction */
  fb.classList.remove('hl','hr');void fb.offsetWidth;fb.classList.add(side<0?'hl':'hr');
  svg.classList.add('hit');clearTimeout(hitT);hitT=setTimeout(()=>svg.classList.remove('hit'),360);
  /* pop word */
  const p=el('div','pop'+(crit?' crit':''),crit?"CRITICAL!":w.words[Math.floor(Math.random()*w.words.length)]);
  p.style.left=(cx-sr.left)+'px';p.style.top=(cy-sr.top-30)+'px';
  p.style.setProperty('--r',(Math.random()*30-15)+'deg');
  if(!crit)p.style.setProperty('--c',["#FFD23F","#FFFFFF","#7CF5E6","#FF9EB5"][Math.floor(Math.random()*4)]);
  stage.appendChild(p);setTimeout(()=>p.remove(),720);
  /* line */
  let k;do{k=Math.floor(Math.random()*c.hits.length);}while(k===impact.k&&c.hits.length>1);
  impact.k=k;say(c.hits[k]);
  if(dig<=0){if(endless)wipe(c);else knockout(c);}
}

function confetti(){
  const w=WBY[weaponId].emoji;
  for(let n=0;n<16;n++){
    const d=el('div','conf',n%3===0?w:CONF[n%CONF.length]);
    const ang=Math.random()*Math.PI*2,dist=90+Math.random()*130;
    d.style.setProperty('--dx',Math.cos(ang)*dist+'px');d.style.setProperty('--dy',(Math.sin(ang)*dist-40)+'px');
    d.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    stage.appendChild(d);setTimeout(()=>d.remove(),1050);
  }
}
function clearLock(){
  if(endless&&endless.lockTimer){clearInterval(endless.lockTimer);endless.lockTimer=null;}
  const l=document.querySelector('.lock');if(l)l.remove();
}
function wipe(c){
  endless.kos++;ko=true;
  fb.classList.remove('hl','hr');void fb.offsetWidth;
  fb.classList.add('ko'+(1+Math.floor(Math.random()*4)));
  svg.classList.add('hit');sfxKO();buzz([60,40,120]);confetti();
  stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');
  say(c.ko);
  let left=5;
  const lk=el('div','lock');
  const paint=()=>{lk.textContent='KNOCKED OUT';lk.appendChild(el('small',null,`Back in ${left}`));};
  paint();stage.appendChild(lk);
  endless.lockTimer=setInterval(()=>{
    left--;
    if(!endless||endless.done){clearLock();return;}
    if(left>0){paint();return;}
    clearLock();
    loadChar(cur);say("Back for more? Slap on!");
  },1000);
}
function knockout(c){
  ko=true;save.beaten[c.id]=true;
  const daily=cur===DAILY;
  fb.classList.remove('hl','hr');void fb.offsetWidth;
  fb.classList.add('ko'+(1+Math.floor(Math.random()*4)));
  svg.classList.add('hit');sfxKO();buzz([60,40,120]);confetti();
  stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');
  const st=el('div','stamp',CAPS[Math.floor(Math.random()*CAPS.length)]);stage.appendChild(st);setTimeout(()=>st.remove(),1750);
  say(c.ko);
  if(c.id==='macaroon'&&weaponId==='baguette')unlockTro('diplo');
  if(c.id==='olaf')unlockTro('nap');
  if(weaponId==='chicken')unlockTro('squeak');
  if(Object.keys(save.beaten).length>=C.length)unlockTro('summit');
  persist();
  if(rush){
    rush.kos++;rush.time+=6;score+=100*(daily?2:1);scEl.textContent=score;setTimerUI();
    if(rush.kos>=C.length){
      setTimeout(()=>endRush(true),1000);
    }else{
      toast("+6 seconds! "+rush.kos+" of "+C.length+" humbled.");
      setTimeout(()=>{
        if(!rush||rush.done)return;
        const n=rush.queue[rush.kos];loadChar(n);say(C[n].intro);
      },1000);
    }
  }else{
    setTimeout(()=>showClassicCard(c),950);
  }
}

/* ---------- share + cards ---------- */
function tweetUrl(text){let u="https://x.com/intent/post?text="+encodeURIComponent(text);if(SHARE_URL)u+="&url="+encodeURIComponent(SHARE_URL);return u;}
function shareBtns(text){
  const a=el('a','btn hot',"Post on X");a.href=tweetUrl(text);a.target="_blank";a.rel="noopener noreferrer";
  const c=el('button','btn',"Copy text");
  c.onclick=async()=>{try{await navigator.clipboard.writeText(text+(SHARE_URL?"\n"+SHARE_URL:""));toast("Copied. Paste it anywhere.");}catch(e){toast("Copy is blocked here. Use Post on X instead.");}};
  return [a,c];
}
function showCard(title,text,stats,btns){
  cardEl.innerHTML='';
  cardEl.appendChild(el('h2',null,title));
  if(stats&&stats.length){const s=el('div','stats');stats.forEach(t=>s.appendChild(el('span','chip',t)));cardEl.appendChild(s);}
  cardEl.appendChild(el('p',null,text));
  const r=el('div','row');btns.forEach(b=>r.appendChild(b));cardEl.appendChild(r);
  cardEl.hidden=false;
}
function btn(label,fn,hot){const b=el('button','btn'+(hot?' hot':''),label);b.onclick=fn;return b;}
function showClassicCard(c){
  const all=Object.keys(save.beaten).length===C.length;
  const w=WBY[weaponId];
  const text=all?`${c.ko} The whole summit is humbled. Please go touch grass.`:c.ko;
  const tweet=`🖐️ SLAP SUMMIT\n\nJust K.O.'d ${c.name} with a ${w.name} ${w.emoji}\nScore: ${score} | Best combo: x${maxCombo}\n\n#SlapSummit`;
  const [post,copy]=shareBtns(tweet);
  const again=btn("Slap again",()=>startGame(cur),false);
  const next=btn("Next victim",()=>{
    let n=-1;for(let k=1;k<=C.length;k++){const j=(cur+k)%C.length;if(!save.beaten[C[j].id]){n=j;break;}}
    startGame(n<0?(cur+1)%C.length:n);
  },true);
  showCard("K.O.!",text,[`Score ${score}`,`Best combo x${maxCombo}`],[post,copy,again,next]);
}
function endRush(cleared){
  if(!rush||rush.done)return;
  rush.done=true;ko=true;stopRush();
  if(cleared){score+=1000+Math.round(Math.max(0,rush.time)*50);scEl.textContent=score;unlockTro('clear');}
  const final=score,kos=rush.kos,left=Math.max(0,Math.round(rush.time));
  if(final>=2000)unlockTro('rush');
  const pb=cleared&&final>save.rushBest;
  submitScore(final,kos,cleared,left);
  say(cleared?"The whole summit is on the floor.":"Time! Nobody has any dignity left.");
  sfxKO();buzz([80,50,80]);
  const w=WBY[weaponId];
  const tweet=cleared
    ?`🖐️ SLAP SUMMIT: RUSH\n\nSUMMIT CLEARED! All ${C.length} dignitaries humbled\nScore: ${final} | ${left}s to spare\nWeapon: ${w.name} ${w.emoji}\n\nBeat that.\n#SlapSummit`
    :`🖐️ SLAP SUMMIT: RUSH\n\n${kos} of ${C.length} dignitaries humbled in Rush\nScore: ${final}\nWeapon: ${w.name} ${w.emoji}\n\nCan you clear all ${C.length}?\n#SlapSummit`;
  const [post,copy]=shareBtns(tweet);
  const again=btn("Rush again",()=>startGame(rush.queue[0]),true);
  const lb=btn("Leaderboard",()=>openSheet('board'),false);
  const menu=btn("Menu",leave,false);
  const stats=[`Score ${final}`,`${kos}/${C.length} K.O.s`,`Combo x${maxCombo}`];
  if(cleared)stats.push(`${left}s left`);
  const text=cleared
    ?(boardState==='live'?(pb?"New personal best! You are on the Crew board.":"Summit cleared. Your run counts for the Crew board."):(SB?"Summit cleared! Could not reach the leaderboard, so this run is saved on this device.":"Summit cleared! The Crew board needs access through Claude, so this run is saved on this device."))
    :`${kos} of ${C.length} humbled. Clear all ${C.length} to land on the Crew board.`;
  showCard(cleared?"CLEARED!":"TIME!",text,stats,[post,copy,again,lb,menu]);
  persist();
}
function endEndless(){
  if(!endless||endless.done)return;
  endless.done=true;ko=true;clearLock();
  const n=endless.slaps,kos=endless.kos,pb=n>save.endlessBest;
  if(pb)save.endlessBest=n;
  if(n>=100)unlockTro('endless100');
  if(n>=400)unlockTro('endless400');
  persist();
  say("Arm retired. Respect.");
  const w=WBY[weaponId],startAt=cur;
  const tweet=`🖐️ SLAP SUMMIT: ENDLESS\n\n${n} nonstop slaps on ${C[startAt].name}\nKnocked out ${kos} times\nScore: ${score} | Best combo: x${maxCombo}\nWeapon: ${w.name} ${w.emoji}\n\n#SlapSummit`;
  const [post,copy]=shareBtns(tweet);
  const again=btn("Go again",()=>startGame(startAt),true);
  const menu=btn("Menu",leave,false);
  showCard("DONE!",pb?"New personal record for Endless!":`Your Endless record is ${save.endlessBest} slaps.`,[`${n} slaps`,`${kos} knockouts`,`Score ${score}`],[post,copy,again,menu]);
}

/* ---------- input ---------- */
stage.addEventListener('pointerdown',e=>{
  if(ko||e.target.closest('.kocard'))return;
  e.preventDefault();down=true;lx=e.clientX;ly=e.clientY;doSlap(e.clientX,e.clientY);
});
stage.addEventListener('pointermove',e=>{
  if(!down||ko)return;
  if(Math.hypot(e.clientX-lx,e.clientY-ly)>80&&performance.now()-lastSwipe>140){lx=e.clientX;ly=e.clientY;doSlap(e.clientX,e.clientY);}
});
addEventListener('pointerup',()=>{down=false;});
addEventListener('pointercancel',()=>{down=false;});
$('back').onclick=()=>{persist();leave();};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';};
$('mClassic').onclick=()=>{mode='classic';renderModeHelp();};
$('mRush').onclick=()=>{mode='rush';renderModeHelp();};
$('mEndless').onclick=()=>{mode='endless';renderModeHelp();};
$('finish').onclick=()=>endEndless();
$('openBoard').onclick=()=>openSheet('board');
$('openTro').onclick=()=>openSheet('tro');
$('nickChip').onclick=()=>openSheet('nick');
addEventListener('pagehide',persist);
document.addEventListener('contextmenu',e=>{if(!plEl.hidden)e.preventDefault();});

renderSelect();
initCloud();
if(!save.nick)openSheet('nick');
</script>
</body>
